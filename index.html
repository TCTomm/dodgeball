<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dodgeball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f1a; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// Layout globals
let CW, CH, crtX, crtY, crtW, crtH, midX, PR, BR;

function resize() {
  CW = canvas.width  = window.innerWidth;
  CH = canvas.height = window.innerHeight;
  crtX = CW * 0.04;
  crtY = CH * 0.115;
  crtW = CW * 0.92;
  crtH = CH * 0.755;
  midX = crtX + crtW / 2;
  PR = Math.max(16, Math.min(CW, CH) * 0.028);
  BR = PR * 0.48;
  if (game.phase !== 'MENU' && game.phase !== 'GAME_OVER') {
    game.players.concat(game.aiPlayers).forEach(p => p.clamp());
  }
}

// ── Config ────────────────────────────────────────────────────────────────────
const C = {
  SLING_MIN_PX:  18,
  SLING_MAX_PX:  90,
  SPD_MIN:      340,
  SPD_MAX:      900,
  WINDUP_MS:   1650,
  AI_SPREAD:   0.13,
  AI_BASE_SPD: 600,
  AI_SPD_VAR:  100,
  AI_MOVE_PX:  135,
  AI_FAST_MUL:  2.2,
  RESULT_MS:    950,
  FLASH_MS:     380,
  DODGE_REACT:  160,
};

// ── Player ────────────────────────────────────────────────────────────────────
class Player {
  constructor(x, y, team, idx) {
    this.x = x; this.y = y;
    this.team = team;
    this.idx  = idx;
    this.alive = true;
    this.flash = 0;
    this.tx = x; this.ty = y;
    this.mt = 0;
    this.winding = false;
  }

  get r() { return PR; }

  zone() {
    const p = PR + 4;
    return this.team === 'blue'
      ? { x0: crtX + p,    x1: midX - p,        y0: crtY + p, y1: crtY + crtH - p }
      : { x0: midX + p,    x1: crtX + crtW - p,  y0: crtY + p, y1: crtY + crtH - p };
  }

  clamp() {
    const z = this.zone();
    this.x = Math.max(z.x0, Math.min(z.x1, this.x));
    this.y = Math.max(z.y0, Math.min(z.y1, this.y));
  }

  clampTarget() {
    const z = this.zone();
    this.tx = Math.max(z.x0, Math.min(z.x1, this.tx));
    this.ty = Math.max(z.y0, Math.min(z.y1, this.ty));
  }
}

// ── Ball ──────────────────────────────────────────────────────────────────────
class Ball {
  constructor(x, y, vx, vy, from) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.from = from;
    this.trail = [];
    this.age = 0;
  }
}

// ── Game State ────────────────────────────────────────────────────────────────
const game = {
  phase:       'MENU',
  mode:        'cpu',   // 'cpu' | 'human'
  players:     [],
  aiPlayers:   [],
  ball:        null,
  effects:     [],
  resultMsg:   '',
  resultTimer: 0,
  resultColor: '#fff',
  winSide:     null,
  windupTimer: 0,
  aiThrower:   null,
  aiTarget:    null,
  lastThrower: null,
};

// ── Multi-touch state ─────────────────────────────────────────────────────────
// Each entry: { kind: 'p1sling'|'p2sling'|'p1drag'|'p2drag',
//               player, ox?, oy?, dx?, dy?, offX?, offY? }
const tMap = new Map();

function getP1Sling() {
  for (const e of tMap.values()) if (e.kind === 'p1sling') return e;
  return null;
}
function getP2Sling() {
  for (const e of tMap.values()) if (e.kind === 'p2sling') return e;
  return null;
}

// ── Menu button rects ─────────────────────────────────────────────────────────
const cpuBtn  = { x: 0, y: 0, w: 0, h: 0 };
const pvpBtn  = { x: 0, y: 0, w: 0, h: 0 };
const playBtn = { x: 0, y: 0, w: 0, h: 0 };

function inBtn(x, y, btn) {
  return x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h;
}

// ── Init / State Transitions ──────────────────────────────────────────────────
function initGame(mode) {
  game.mode = mode;
  const yFracs = [0.20, 0.50, 0.80];
  const bx = crtX + crtW * 0.13;
  const rx = crtX + crtW * 0.87;
  game.players   = yFracs.map((f, i) => new Player(bx, crtY + crtH * f, 'blue', i));
  game.aiPlayers = yFracs.map((f, i) => {
    const p = new Player(rx, crtY + crtH * f, 'red', i);
    p.tx = rx; p.ty = p.y;
    p.mt = 200 + Math.random() * 800;
    return p;
  });
  game.ball        = null;
  game.effects     = [];
  game.resultMsg   = '';
  game.resultTimer = 0;
  game.winSide     = null;
  game.lastThrower = null;
  goto('PLAYER_ATTACK');
}

function goto(phase) {
  game.phase = phase;
  tMap.clear();

  if (phase === 'PLAYER_ATTACK') {
    game.ball = null;
    game.aiPlayers.forEach(p => { p.winding = false; p.mt = 0; });
  }

  if (phase === 'P2_ATTACK') {
    game.ball = null;
  }

  if (phase === 'AI_WINDUP') {
    game.ball = null;
    const alive   = game.aiPlayers.filter(p => p.alive);
    const targets = game.players.filter(p => p.alive);
    game.aiThrower = alive[Math.floor(Math.random() * alive.length)];
    game.aiTarget  = targets[Math.floor(Math.random() * targets.length)];
    game.windupTimer = C.WINDUP_MS;
    game.aiThrower.winding = true;
    game.aiThrower.tx = midX - PR * 3.5;
    game.aiThrower.ty = game.aiTarget.y;
    game.aiThrower.mt = 99999;
    game.lastThrower = 'ai';
  }

  if (phase === 'GAME_OVER') {
    game.ball = null;
  }
}

// ── AI Movement ───────────────────────────────────────────────────────────────
function updateAI(dt) {
  game.aiPlayers.forEach(p => {
    if (!p.alive) return;

    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 1.5) {
      const speed = C.AI_MOVE_PX * (p.winding ? C.AI_FAST_MUL : 1.0) * dt / 1000;
      const step  = Math.min(dist, speed);
      p.x += (dx / dist) * step;
      p.y += (dy / dist) * step;
      p.clamp();
    }

    if (!p.winding) {
      p.mt -= dt;
      if (p.mt <= 0) pickAIWanderTarget(p);
    }

    if (p.winding && game.aiTarget && game.aiTarget.alive) {
      p.ty = game.aiTarget.y;
    }
  });

  if (game.phase === 'BALL_FLYING_P' && game.ball) {
    aiReactToBall(game.ball);
  }
}

function pickAIWanderTarget(p) {
  const z = p.zone();
  p.tx = z.x0 + Math.random() * (z.x1 - z.x0);
  p.ty = z.y0 + Math.random() * (z.y1 - z.y0);
  p.clampTarget();
  p.mt = 600 + Math.random() * 1000;
}

function aiReactToBall(ball) {
  const spd2 = ball.vx * ball.vx + ball.vy * ball.vy;
  if (spd2 < 1) return;

  game.aiPlayers.forEach(p => {
    if (!p.alive || p.mt > 400) return;

    const bpx = p.x - ball.x, bpy = p.y - ball.y;
    const dot = ball.vx * bpx + ball.vy * bpy;
    if (dot <= 0) return;

    const t = dot / spd2;
    if (t > 1.4) return;

    const futX = ball.x + ball.vx * t;
    const futY = ball.y + ball.vy * t;
    const miss = Math.hypot(futX - p.x, futY - p.y);

    if (miss < PR * 2.2) {
      const spd  = Math.sqrt(spd2);
      const perpX = -ball.vy / spd;
      const perpY =  ball.vx / spd;
      const dir   = (p.y < crtY + crtH * 0.5) ? 1 : -1;
      p.tx = p.x + perpX * dir * PR * 3.2;
      p.ty = p.y + perpY * dir * PR * 3.2;
      p.clampTarget();
      p.mt = 650;
    }
  });
}

// ── Throws ────────────────────────────────────────────────────────────────────
function playerThrow(entry) {
  const p = entry.player;
  if (!p || !p.alive) return;

  const dist = Math.hypot(entry.dx, entry.dy);
  if (dist < C.SLING_MIN_PX) return;

  const ndx = -entry.dx / dist, ndy = -entry.dy / dist;
  const t   = Math.min(1, dist / C.SLING_MAX_PX);
  const spd = C.SPD_MIN + t * (C.SPD_MAX - C.SPD_MIN);

  game.ball = new Ball(p.x, p.y, ndx * spd, ndy * spd, 'blue');
  game.phase       = 'BALL_FLYING_P';
  game.lastThrower = 'p1';

  if (game.mode === 'cpu') {
    setTimeout(() => {
      if (game.ball && game.ball.from === 'blue') aiReactToBall(game.ball);
    }, C.DODGE_REACT);
  }
}

function p2Throw(entry) {
  const p = entry.player;
  if (!p || !p.alive) return;

  const dist = Math.hypot(entry.dx, entry.dy);
  if (dist < C.SLING_MIN_PX) return;

  const ndx = -entry.dx / dist, ndy = -entry.dy / dist;
  const t   = Math.min(1, dist / C.SLING_MAX_PX);
  const spd = C.SPD_MIN + t * (C.SPD_MAX - C.SPD_MIN);

  game.ball = new Ball(p.x, p.y, ndx * spd, ndy * spd, 'red');
  game.phase       = 'BALL_FLYING_2';
  game.lastThrower = 'p2';
}

function aiThrow() {
  const th = game.aiThrower, tg = game.aiTarget;
  if (!th || !th.alive || !tg || !tg.alive) { goto('PLAYER_ATTACK'); return; }

  const angle = Math.atan2(tg.y - th.y, tg.x - th.x)
                + (Math.random() - 0.5) * C.AI_SPREAD * 2;
  const spd   = C.AI_BASE_SPD + (Math.random() - 0.5) * C.AI_SPD_VAR;

  game.ball = new Ball(th.x, th.y, Math.cos(angle) * spd, Math.sin(angle) * spd, 'red');
  th.winding = false;
  th.mt = 0;
  game.phase = 'BALL_FLYING_A';
}

// ── Ball Physics & Hit Detection ──────────────────────────────────────────────
function updateBall(dt) {
  const b = game.ball;
  if (!b) return;

  b.age += dt;
  b.trail.push({ x: b.x, y: b.y });
  if (b.trail.length > 10) b.trail.shift();

  b.x += b.vx * dt / 1000;
  b.y += b.vy * dt / 1000;

  const mg = BR + 8;
  if (b.x < crtX - mg || b.x > crtX + crtW + mg ||
      b.y < crtY - mg || b.y > crtY + crtH + mg) {
    onMiss(); return;
  }

  const targets = b.from === 'blue' ? game.aiPlayers : game.players;
  for (const p of targets) {
    if (!p.alive) continue;
    if (Math.hypot(b.x - p.x, b.y - p.y) < (BR + p.r) * 0.82) {
      onHit(p); return;
    }
  }
}

function onHit(p) {
  p.alive = false;
  p.flash = C.FLASH_MS;
  game.effects.push({
    x: p.x, y: p.y, age: 0, dur: 650,
    maxR: PR * 3,
    color: p.team === 'blue' ? '#3a86ff' : '#ff4444',
  });
  game.ball        = null;
  game.resultMsg   = 'HIT!';
  game.resultColor = '#ff4444';
  game.resultTimer = C.RESULT_MS;
}

function onMiss() {
  game.ball        = null;
  game.resultMsg   = 'MISS!';
  game.resultColor = '#00ff88';
  game.resultTimer = C.RESULT_MS;
}

function checkWin() {
  const ra = game.aiPlayers.filter(p => p.alive).length;
  const pa = game.players.filter(p => p.alive).length;
  if (ra === 0) { game.winSide = 'blue'; goto('GAME_OVER'); return; }
  if (pa === 0) { game.winSide = 'red';  goto('GAME_OVER'); return; }

  if (game.mode === 'human') {
    if (game.lastThrower === 'p1') goto('P2_ATTACK');
    else goto('PLAYER_ATTACK');
  } else {
    if (game.lastThrower === 'p1') goto('AI_WINDUP');
    else goto('PLAYER_ATTACK');
  }
}

// ── Update Loop ───────────────────────────────────────────────────────────────
let lastTs = 0;

function update(dt) {
  game.players.concat(game.aiPlayers).forEach(p => { if (p.flash > 0) p.flash -= dt; });
  game.effects = game.effects.filter(e => { e.age += dt; return e.age < e.dur; });

  if (game.resultTimer > 0) {
    game.resultTimer -= dt;
    if (game.resultTimer <= 0) checkWin();
    if (game.mode === 'cpu' && game.phase !== 'MENU' && game.phase !== 'GAME_OVER') updateAI(dt);
    return;
  }

  const ph = game.phase;
  if (ph === 'MENU' || ph === 'GAME_OVER') return;

  updateBall(dt);

  if (game.mode === 'cpu') {
    updateAI(dt);
    if (ph === 'AI_WINDUP') {
      game.windupTimer -= dt;
      if (game.windupTimer <= 0) aiThrow();
    }
  }
}

// ── Input ─────────────────────────────────────────────────────────────────────
function nearPlayer(x, y, p) {
  return p.alive && Math.hypot(x - p.x, y - p.y) < p.r * 1.9;
}

function startTouch(id, x, y) {
  const ph = game.phase;

  // P1 slingshot: attack turn, touch a blue player
  if (ph === 'PLAYER_ATTACK' && !getP1Sling()) {
    for (const p of game.players) {
      if (nearPlayer(x, y, p)) {
        tMap.set(id, { kind: 'p1sling', player: p, ox: p.x, oy: p.y, dx: 0, dy: 0 });
        return;
      }
    }
  }

  // P2 slingshot (human mode): P2 attack turn, touch a red player
  if (ph === 'P2_ATTACK' && !getP2Sling()) {
    for (const p of game.aiPlayers) {
      if (nearPlayer(x, y, p)) {
        tMap.set(id, { kind: 'p2sling', player: p, ox: p.x, oy: p.y, dx: 0, dy: 0 });
        return;
      }
    }
  }

  // P1 dodge: drag blue players during P2's attack/flight
  if (ph === 'P2_ATTACK' || ph === 'BALL_FLYING_2') {
    for (const p of game.players) {
      if (nearPlayer(x, y, p)) {
        tMap.set(id, { kind: 'p1drag', player: p, offX: p.x - x, offY: p.y - y });
        return;
      }
    }
  }

  // P2 dodge (human mode): drag red players during P1's attack/flight
  if (game.mode === 'human' && (ph === 'PLAYER_ATTACK' || ph === 'BALL_FLYING_P')) {
    for (const p of game.aiPlayers) {
      if (nearPlayer(x, y, p)) {
        tMap.set(id, { kind: 'p2drag', player: p, offX: p.x - x, offY: p.y - y });
        return;
      }
    }
  }

  // P1 dodge (cpu mode): drag blue players while AI is attacking
  if (game.mode === 'cpu' && (ph === 'AI_WINDUP' || ph === 'BALL_FLYING_A')) {
    for (const p of game.players) {
      if (nearPlayer(x, y, p)) {
        tMap.set(id, { kind: 'p1drag', player: p, offX: p.x - x, offY: p.y - y });
        return;
      }
    }
  }
}

function moveTouch(id, x, y) {
  const e = tMap.get(id);
  if (!e) return;
  if (e.kind === 'p1sling' || e.kind === 'p2sling') {
    e.dx = x - e.ox;
    e.dy = y - e.oy;
  } else {
    e.player.x = x + e.offX;
    e.player.y = y + e.offY;
    e.player.clamp();
  }
}

function endTouch(id) {
  const e = tMap.get(id);
  if (e) {
    if (e.kind === 'p1sling') playerThrow(e);
    if (e.kind === 'p2sling') p2Throw(e);
  }
  tMap.delete(id);
}

function handleOverlayTouch(x, y) {
  if (game.phase === 'MENU') {
    if (inBtn(x, y, cpuBtn))  initGame('cpu');
    else if (inBtn(x, y, pvpBtn)) initGame('human');
  } else if (game.phase === 'GAME_OVER') {
    if (inBtn(x, y, playBtn)) initGame(game.mode);
  }
}

const MOUSE_ID = -1;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  for (const t of e.changedTouches) {
    const x = t.clientX - r.left, y = t.clientY - r.top;
    if (game.phase === 'MENU' || game.phase === 'GAME_OVER') handleOverlayTouch(x, y);
    else startTouch(t.identifier, x, y);
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  for (const t of e.changedTouches) {
    moveTouch(t.identifier, t.clientX - r.left, t.clientY - r.top);
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) endTouch(t.identifier);
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (game.phase === 'MENU' || game.phase === 'GAME_OVER') handleOverlayTouch(x, y);
  else startTouch(MOUSE_ID, x, y);
});
canvas.addEventListener('mousemove', e => {
  if (!tMap.has(MOUSE_ID)) return;
  const r = canvas.getBoundingClientRect();
  moveTouch(MOUSE_ID, e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('mouseup', () => endTouch(MOUSE_ID));

// ── Rendering ─────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, CW, CH);

  drawCourt();
  drawEffects();

  if (game.ball) { drawTrail(game.ball); drawBallShape(game.ball); }

  game.aiPlayers.concat(game.players).forEach(drawPlayer);

  // Slingshot overlays
  const p1sl = getP1Sling();
  const p2sl = getP2Sling();
  if (p1sl) drawSlingshot(p1sl, '#3a86ff');
  if (p2sl) drawSlingshot(p2sl, '#ff4444');

  const ph = game.phase;

  // CPU mode warning / windup rings
  if (game.mode === 'cpu') {
    if ((ph === 'AI_WINDUP' || ph === 'BALL_FLYING_A') && game.aiTarget && game.aiTarget.alive) {
      drawWarnRing(game.aiTarget);
    }
    if (ph === 'AI_WINDUP' && game.aiThrower && game.aiThrower.alive) {
      drawWindupRing();
    }
  }

  drawHUD();
  if (game.resultMsg && game.resultTimer > 0) drawResult();
  if (ph === 'MENU')      drawMenu();
  if (ph === 'GAME_OVER') drawGameOver();
}

// ── Court ─────────────────────────────────────────────────────────────────────
function drawCourt() {
  ctx.fillStyle = '#1a4a24';
  rr(crtX, crtY, crtW, crtH, 12);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const y = crtY + crtH * i / 6;
    ctx.beginPath();
    ctx.moveTo(crtX + 10, y);
    ctx.lineTo(crtX + crtW - 10, y);
    ctx.stroke();
  }

  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(midX, crtY + 10);
  ctx.lineTo(midX, crtY + crtH - 10);
  ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 3;
  rr(crtX, crtY, crtW, crtH, 12);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  ctx.font      = `bold ${Math.max(11, PR * 0.68)}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  if (game.mode === 'human') {
    ctx.fillText('P1 SIDE', crtX + crtW * 0.25, crtY + crtH * 0.5);
    ctx.fillText('P2 SIDE', crtX + crtW * 0.75, crtY + crtH * 0.5);
  } else {
    ctx.fillText('YOUR SIDE',  crtX + crtW * 0.25, crtY + crtH * 0.5);
    ctx.fillText('THEIR SIDE', crtX + crtW * 0.75, crtY + crtH * 0.5);
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h,     x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y,         x + r, y);
  ctx.closePath();
}

// ── Player ────────────────────────────────────────────────────────────────────
function drawPlayer(p) {
  if (!p.alive) return;
  ctx.save();

  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur  = 8;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = p.flash > 0 ? '#ffffff' : (p.team === 'blue' ? '#3a86ff' : '#ff4444');
  ctx.fill();
  ctx.shadowBlur = 0;

  const g = ctx.createRadialGradient(
    p.x - p.r * 0.3, p.y - p.r * 0.35, p.r * 0.1,
    p.x, p.y, p.r
  );
  g.addColorStop(0, 'rgba(255,255,255,0.3)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.fillStyle    = '#ffffff';
  ctx.font         = `bold ${Math.round(p.r * 0.78)}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.idx + 1, p.x, p.y + 1);

  ctx.restore();
}

// ── Slingshot ─────────────────────────────────────────────────────────────────
function drawSlingshot(entry, ghostColor) {
  const p    = entry.player;
  const dist = Math.hypot(entry.dx, entry.dy);
  const t    = Math.min(1, dist / C.SLING_MAX_PX);
  const cx   = entry.ox + entry.dx;
  const cy   = entry.oy + entry.dy;

  if (dist >= C.SLING_MIN_PX) {
    const ndx = -entry.dx / dist;
    const ndy = -entry.dy / dist;
    ctx.save();
    ctx.setLineDash([6, 9]);
    ctx.strokeStyle = `rgba(255,255,80,${0.3 + t * 0.5})`;
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + ndx * crtW * 0.9, p.y + ndy * crtW * 0.9);
    ctx.stroke();
    ctx.restore();
  }

  ctx.strokeStyle = `rgba(255,210,0,0.75)`;
  ctx.lineWidth   = 3;
  ctx.beginPath();
  ctx.moveTo(p.x - p.r * 0.45, p.y);
  ctx.lineTo(cx, cy);
  ctx.moveTo(p.x + p.r * 0.45, p.y);
  ctx.lineTo(cx, cy);
  ctx.stroke();

  ctx.save();
  ctx.globalAlpha = 0.38;
  ctx.beginPath();
  ctx.arc(cx, cy, p.r, 0, Math.PI * 2);
  ctx.fillStyle = ghostColor;
  ctx.fill();
  ctx.restore();

  if (dist >= C.SLING_MIN_PX) {
    const bw = 58, bh = 8;
    const bx = p.x - bw / 2;
    const by = p.y - p.r - 22;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = t < 0.4 ? '#00ff88' : t < 0.72 ? '#ffcc00' : '#ff4444';
    ctx.fillRect(bx, by, bw * t, bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
  }
}

// ── Warning & Windup ──────────────────────────────────────────────────────────
function drawWarnRing(p) {
  const pulse = (Math.sin(Date.now() / 80) + 1) / 2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r + 8 + pulse * 12, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255,60,60,${0.55 + pulse * 0.45})`;
  ctx.lineWidth   = 4;
  ctx.stroke();
  ctx.fillStyle    = `rgba(255,90,90,${0.82 + pulse * 0.18})`;
  ctx.font         = `bold ${Math.round(PR * 0.68)}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('MOVE!', p.x, p.y - p.r - 5);
}

function drawWindupRing() {
  const p    = game.aiThrower;
  const frac = 1 - game.windupTimer / C.WINDUP_MS;

  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r + 13, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth   = 5;
  ctx.lineCap     = 'round';
  ctx.stroke();

  if (game.aiTarget && game.aiTarget.alive) {
    ctx.save();
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = 'rgba(255,100,100,0.32)';
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(game.aiTarget.x, game.aiTarget.y);
    ctx.stroke();
    ctx.restore();
  }
}

// ── Ball ──────────────────────────────────────────────────────────────────────
function drawTrail(b) {
  b.trail.forEach((pt, i) => {
    const a = (i / b.trail.length) * 0.38;
    const r = BR * (0.35 + 0.65 * (i / b.trail.length));
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,220,255,${a})`;
    ctx.fill();
  });
}

function drawBallShape(b) {
  ctx.shadowColor = 'rgba(255,255,255,0.5)';
  ctx.shadowBlur  = 10;
  const g = ctx.createRadialGradient(
    b.x - BR * 0.3, b.y - BR * 0.35, 1,
    b.x, b.y, BR
  );
  g.addColorStop(0,   '#ffffff');
  g.addColorStop(0.6, '#dddddd');
  g.addColorStop(1,   '#aaaaaa');
  ctx.beginPath();
  ctx.arc(b.x, b.y, BR, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ── Effects ───────────────────────────────────────────────────────────────────
function drawEffects() {
  game.effects.forEach(fx => {
    const t = fx.age / fx.dur;
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, fx.maxR * t, 0, Math.PI * 2);
    ctx.strokeStyle  = fx.color;
    ctx.globalAlpha  = 1 - t;
    ctx.lineWidth    = 3;
    ctx.stroke();
    ctx.globalAlpha  = 1;
  });
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD() {
  const fsz = Math.max(14, Math.round(CH * 0.026));

  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(0, 0, CW, crtY - 2);

  const ab = game.players.filter(p => p.alive).length;
  const ar = game.aiPlayers.filter(p => p.alive).length;

  ctx.font         = `bold ${fsz}px Arial`;
  ctx.textBaseline = 'middle';

  if (game.mode === 'human') {
    ctx.fillStyle = '#3a86ff';
    ctx.textAlign = 'left';
    ctx.fillText(`P1: ${ab}/3`, 14, crtY / 2);
    ctx.fillStyle = '#ff4444';
    ctx.textAlign = 'right';
    ctx.fillText(`P2: ${ar}/3`, CW - 14, crtY / 2);
  } else {
    ctx.fillStyle = '#3a86ff';
    ctx.textAlign = 'left';
    ctx.fillText(`YOU: ${ab}/3`, 14, crtY / 2);
    ctx.fillStyle = '#ff4444';
    ctx.textAlign = 'right';
    ctx.fillText(`THEM: ${ar}/3`, CW - 14, crtY / 2);
  }

  const ph = game.phase;
  const phLabel = game.mode === 'human'
    ? { PLAYER_ATTACK: 'P1 ATTACK', BALL_FLYING_P: 'IN FLIGHT',
        P2_ATTACK: 'P2 ATTACK',     BALL_FLYING_2: 'IN FLIGHT' }[ph]
    : { PLAYER_ATTACK: 'YOUR TURN', BALL_FLYING_P: 'IN FLIGHT',
        AI_WINDUP: '⚠ INCOMING!',   BALL_FLYING_A: 'DODGE!' }[ph];

  if (phLabel) {
    let color = '#ffffff';
    if (game.mode === 'human') {
      if (ph === 'PLAYER_ATTACK') color = '#5599ff';
      else if (ph === 'P2_ATTACK') color = '#ff7070';
    } else {
      if (ph === 'AI_WINDUP' || ph === 'BALL_FLYING_A') color = '#ff8080';
    }
    ctx.fillStyle = color;
    ctx.font      = `bold ${fsz}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(phLabel, CW / 2, crtY / 2);
  }

  const barY = crtY + crtH + 4;
  const barH = CH - barY;
  if (barH > 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(0, barY, CW, barH);

    const hint = game.mode === 'human'
      ? { PLAYER_ATTACK: 'P1: pull back to throw  •  P2: drag to dodge',
          BALL_FLYING_P: 'P2: drag your players to dodge!',
          P2_ATTACK:     'P2: pull back to throw  •  P1: drag to dodge',
          BALL_FLYING_2: 'P1: drag your players to dodge!' }[ph]
      : { PLAYER_ATTACK: 'Pull back a player to aim & throw',
          BALL_FLYING_P: '',
          AI_WINDUP:     'Drag your players to dodge!',
          BALL_FLYING_A: 'Drag to dodge!' }[ph];

    if (hint) {
      ctx.fillStyle    = 'rgba(255,255,255,0.65)';
      ctx.font         = `${Math.max(11, Math.round(CH * 0.021))}px Arial`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(hint, CW / 2, barY + barH / 2);
    }

    if (game.mode === 'cpu' && ph === 'AI_WINDUP') {
      const frac = game.windupTimer / C.WINDUP_MS;
      const bw2  = Math.min(CW * 0.32, 170);
      const bh2  = Math.min(barH * 0.32, 9);
      const bx2  = CW / 2 - bw2 / 2;
      const by2  = barY + barH / 2 + 14;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(bx2, by2, bw2, bh2);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(bx2, by2, bw2 * frac, bh2);
    }
  }
}

function drawResult() {
  const a  = Math.min(1, game.resultTimer / (C.RESULT_MS * 0.45));
  const sz = Math.max(28, Math.round(CH * 0.06));
  ctx.save();
  ctx.globalAlpha  = a;
  ctx.font         = `bold ${sz}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = game.resultColor;
  ctx.shadowColor  = 'rgba(0,0,0,0.85)';
  ctx.shadowBlur   = 10;
  ctx.fillText(game.resultMsg, CW / 2, crtY + crtH / 2);
  ctx.restore();
}

// ── Overlays ──────────────────────────────────────────────────────────────────
function drawOverlay(title, titleColor, sub) {
  ctx.fillStyle = 'rgba(10,10,30,0.86)';
  ctx.fillRect(0, 0, CW, CH);

  const cx = CW / 2, cy = CH / 2;
  const tsz = Math.max(32, Math.round(CH * 0.075));
  ctx.fillStyle    = titleColor;
  ctx.font         = `bold ${tsz}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor  = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur   = 12;
  ctx.fillText(title, cx, cy - CH * 0.18);
  ctx.shadowBlur   = 0;

  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.font      = `${Math.max(13, Math.round(CH * 0.026))}px Arial`;
  ctx.fillText(sub, cx, cy - CH * 0.08);
}

function drawMenuBtn(btn, color, label, sublabel) {
  ctx.fillStyle = color;
  rr(btn.x, btn.y, btn.w, btn.h, 10);
  ctx.fill();
  ctx.fillStyle    = '#ffffff';
  ctx.font         = `bold ${Math.max(14, Math.round(CH * 0.030))}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, btn.x + btn.w / 2, btn.y + btn.h * 0.38);
  if (sublabel) {
    ctx.font      = `${Math.max(11, Math.round(CH * 0.019))}px Arial`;
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.fillText(sublabel, btn.x + btn.w / 2, btn.y + btn.h * 0.72);
  }
}

function drawMenu() {
  drawOverlay('DODGEBALL', '#ffffff', 'Pull back to throw  •  Drag to dodge');

  const cx = CW / 2, cy = CH / 2;
  const bw = Math.min(200, CW * 0.40);
  const bh = Math.max(52, CH * 0.08);
  const gap = Math.min(18, CW * 0.04);
  const totalW = bw * 2 + gap;

  cpuBtn.w = bw; cpuBtn.h = bh;
  pvpBtn.w = bw; pvpBtn.h = bh;
  cpuBtn.x = cx - totalW / 2;
  pvpBtn.x = cpuBtn.x + bw + gap;
  cpuBtn.y = pvpBtn.y = cy - CH * 0.01;

  drawMenuBtn(cpuBtn, '#2255cc', 'VS COMPUTER', '1 player');
  drawMenuBtn(pvpBtn, '#bb2200', 'VS PLAYER',   '2 players · same device');

  ctx.fillStyle    = 'rgba(255,255,255,0.35)';
  ctx.font         = `${Math.max(11, Math.round(CH * 0.019))}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(
    'Opponents move dynamically — aim carefully!',
    cx, cpuBtn.y + bh + Math.max(20, CH * 0.042)
  );
}

function drawGameOver() {
  const blueWon = game.winSide === 'blue';
  const ab  = game.players.filter(p => p.alive).length;
  const ar  = game.aiPlayers.filter(p => p.alive).length;

  let title, titleColor, sub;
  if (game.mode === 'human') {
    title      = blueWon ? 'P1 WINS!' : 'P2 WINS!';
    titleColor = blueWon ? '#3a86ff'  : '#ff4444';
    sub        = `P1: ${ab} alive  •  P2: ${ar} alive`;
  } else {
    title      = blueWon ? 'YOU WIN!' : 'YOU LOSE!';
    titleColor = blueWon ? '#00ff88'  : '#ff4444';
    sub        = `Blue: ${ab} alive  •  Red: ${ar} alive`;
  }
  drawOverlay(title, titleColor, sub);

  const cx = CW / 2, cy = CH / 2;
  playBtn.w = Math.min(220, CW * 0.5);
  playBtn.h = Math.max(46, CH * 0.07);
  playBtn.x = cx - playBtn.w / 2;
  playBtn.y = cy + CH * 0.04;

  ctx.fillStyle = '#3a86ff';
  rr(playBtn.x, playBtn.y, playBtn.w, playBtn.h, 10);
  ctx.fill();
  ctx.fillStyle    = '#ffffff';
  ctx.font         = `bold ${Math.max(16, Math.round(CH * 0.032))}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PLAY AGAIN', cx, playBtn.y + playBtn.h / 2);
}

// ── Game Loop ─────────────────────────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min(ts - lastTs, 50);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(ts => { lastTs = ts; loop(ts); });
</script>
</body>
