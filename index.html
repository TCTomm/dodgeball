<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dodgeball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f1a; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// Layout globals
let CW, CH, crtX, crtY, crtW, crtH, midX, PR, BR;

function resize() {
  CW = canvas.width  = window.innerWidth;
  CH = canvas.height = window.innerHeight;
  crtX = CW * 0.04;
  crtY = CH * 0.115;
  crtW = CW * 0.92;
  crtH = CH * 0.755;
  midX = crtX + crtW / 2;
  PR = Math.max(16, Math.min(CW, CH) * 0.028);
  BR = PR * 0.48;
  if (game.phase !== 'MENU' && game.phase !== 'GAME_OVER') {
    game.players.concat(game.aiPlayers).forEach(p => p.clamp());
  }
}

// ── Config ────────────────────────────────────────────────────────────────────
const C = {
  SLING_MIN_PX:  18,    // min pull distance to register a throw
  SLING_MAX_PX:  90,    // pull distance for maximum speed
  SPD_MIN:      340,
  SPD_MAX:      900,
  WINDUP_MS:   2100,    // AI wind-up before throw
  AI_SPREAD:   0.24,    // radians of random spread on AI throw
  AI_BASE_SPD: 540,
  AI_SPD_VAR:  120,
  AI_MOVE_PX:  135,     // px/s AI wander speed
  AI_FAST_MUL:  2.2,    // speed multiplier when winding up
  RESULT_MS:    950,
  FLASH_MS:     380,
  DODGE_REACT:  300,    // ms before AI reacts to incoming ball
};

// ── Player ────────────────────────────────────────────────────────────────────
class Player {
  constructor(x, y, team, idx) {
    this.x = x; this.y = y;
    this.team = team;
    this.idx  = idx;
    this.alive = true;
    this.flash = 0;
    // AI roam state
    this.tx = x; this.ty = y;   // current move target
    this.mt = 0;                 // move timer (ms until new target)
    this.winding = false;        // is this AI player winding up a throw?
  }

  get r() { return PR; }

  zone() {
    const p = PR + 4;
    return this.team === 'blue'
      ? { x0: crtX + p,    x1: midX - p,        y0: crtY + p, y1: crtY + crtH - p }
      : { x0: midX + p,    x1: crtX + crtW - p,  y0: crtY + p, y1: crtY + crtH - p };
  }

  clamp() {
    const z = this.zone();
    this.x = Math.max(z.x0, Math.min(z.x1, this.x));
    this.y = Math.max(z.y0, Math.min(z.y1, this.y));
  }

  clampTarget() {
    const z = this.zone();
    this.tx = Math.max(z.x0, Math.min(z.x1, this.tx));
    this.ty = Math.max(z.y0, Math.min(z.y1, this.ty));
  }
}

// ── Ball ──────────────────────────────────────────────────────────────────────
class Ball {
  constructor(x, y, vx, vy, from) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.from = from;   // 'blue' | 'red'
    this.trail = [];
    this.age = 0;
  }
}

// ── Game State ────────────────────────────────────────────────────────────────
const game = {
  phase:       'MENU',
  players:     [],
  aiPlayers:   [],
  ball:        null,
  effects:     [],
  resultMsg:   '',
  resultTimer: 0,
  resultColor: '#fff',
  winSide:     null,
  windupTimer: 0,
  aiThrower:   null,
  aiTarget:    null,
  lastThrower: null,   // 'player' | 'ai' — who threw last
};

// ── Slingshot drag state ──────────────────────────────────────────────────────
const sl = { on: false, player: null, ox: 0, oy: 0, dx: 0, dy: 0 };

// ── Move drag state (defend phase) ───────────────────────────────────────────
const mv = { on: false, player: null, offX: 0, offY: 0 };

// ── Init / State Transitions ──────────────────────────────────────────────────
function initGame() {
  const yFracs = [0.20, 0.50, 0.80];
  const bx = crtX + crtW * 0.13;
  const rx = crtX + crtW * 0.87;
  game.players   = yFracs.map((f, i) => new Player(bx, crtY + crtH * f, 'blue', i));
  game.aiPlayers = yFracs.map((f, i) => {
    const p = new Player(rx, crtY + crtH * f, 'red', i);
    p.tx = rx; p.ty = p.y;
    p.mt = 200 + Math.random() * 800;
    return p;
  });
  game.ball        = null;
  game.effects     = [];
  game.resultMsg   = '';
  game.resultTimer = 0;
  game.winSide     = null;
  game.lastThrower = null;
  sl.on = false;
  mv.on = false;
  goto('PLAYER_ATTACK');
}

function goto(phase) {
  game.phase = phase;

  if (phase === 'PLAYER_ATTACK') {
    game.ball = null;
    sl.on = false;
    mv.on = false;
    game.aiPlayers.forEach(p => { p.winding = false; });
  }

  if (phase === 'AI_WINDUP') {
    game.ball = null;
    sl.on = false;
    mv.on = false;
    const alive   = game.aiPlayers.filter(p => p.alive);
    const targets = game.players.filter(p => p.alive);
    game.aiThrower = alive[Math.floor(Math.random() * alive.length)];
    game.aiTarget  = targets[Math.floor(Math.random() * targets.length)];
    game.windupTimer = C.WINDUP_MS;
    // Thrower charges toward center
    game.aiThrower.winding = true;
    game.aiThrower.tx = midX - PR * 3.5;
    game.aiThrower.ty = game.aiTarget.y;
    game.aiThrower.mt = 99999;
    game.lastThrower = 'ai';
  }

  if (phase === 'GAME_OVER') {
    game.ball = null;
    sl.on = false;
    mv.on = false;
  }
}

// ── AI Movement ───────────────────────────────────────────────────────────────
function updateAI(dt) {
  game.aiPlayers.forEach(p => {
    if (!p.alive) return;

    // Move toward current target
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 1.5) {
      const speed = C.AI_MOVE_PX * (p.winding ? C.AI_FAST_MUL : 1.0) * dt / 1000;
      const step  = Math.min(dist, speed);
      p.x += (dx / dist) * step;
      p.y += (dy / dist) * step;
      p.clamp();
    }

    // Tick move timer and pick new wander target
    if (!p.winding) {
      p.mt -= dt;
      if (p.mt <= 0) pickAIWanderTarget(p);
    }

    // Thrower tracks the target's y during wind-up
    if (p.winding && game.aiTarget && game.aiTarget.alive) {
      p.ty = game.aiTarget.y;
    }
  });

  // React to a ball flying toward the AI side
  if (game.phase === 'BALL_FLYING_P' && game.ball) {
    aiReactToBall(game.ball);
  }
}

function pickAIWanderTarget(p) {
  const z = p.zone();
  // During player attack, AI spreads a bit wider; otherwise normal roam
  p.tx = z.x0 + Math.random() * (z.x1 - z.x0);
  p.ty = z.y0 + Math.random() * (z.y1 - z.y0);
  p.clampTarget();
  p.mt = 600 + Math.random() * 1000;
}

// Trajectory-prediction dodge for AI
function aiReactToBall(ball) {
  const spd2 = ball.vx * ball.vx + ball.vy * ball.vy;
  if (spd2 < 1) return;

  game.aiPlayers.forEach(p => {
    if (!p.alive || p.mt > 400) return; // already committed to a move

    // Vector from ball to player
    const bpx = p.x - ball.x, bpy = p.y - ball.y;
    const dot = ball.vx * bpx + ball.vy * bpy;
    if (dot <= 0) return; // ball heading away

    // Time to closest approach
    const t = dot / spd2;
    if (t > 1.4) return; // too far in future

    const futX = ball.x + ball.vx * t;
    const futY = ball.y + ball.vy * t;
    const miss = Math.hypot(futX - p.x, futY - p.y);

    if (miss < PR * 3.5) {
      // Dodge perpendicular to ball direction
      const spd  = Math.sqrt(spd2);
      const perpX = -ball.vy / spd;
      const perpY =  ball.vx / spd;
      const dir   = (p.y < crtY + crtH * 0.5) ? 1 : -1;
      p.tx = p.x + perpX * dir * PR * 3.8;
      p.ty = p.y + perpY * dir * PR * 3.8;
      p.clampTarget();
      p.mt = 750; // hold the dodge for a bit
    }
  });
}

// ── Throws ────────────────────────────────────────────────────────────────────
function playerThrow() {
  const p = sl.player;
  if (!p || !p.alive) { sl.on = false; return; }

  const dist = Math.sqrt(sl.dx * sl.dx + sl.dy * sl.dy);
  if (dist < C.SLING_MIN_PX) { sl.on = false; return; }

  // Throw direction is OPPOSITE of pull
  const ndx = -sl.dx / dist, ndy = -sl.dy / dist;
  const t   = Math.min(1, dist / C.SLING_MAX_PX);
  const spd = C.SPD_MIN + t * (C.SPD_MAX - C.SPD_MIN);

  game.ball = new Ball(p.x, p.y, ndx * spd, ndy * spd, 'blue');
  sl.on = false;
  game.phase       = 'BALL_FLYING_P';
  game.lastThrower = 'player';

  // Delayed AI reaction (gives player a fair reaction window too)
  setTimeout(() => {
    if (game.ball && game.ball.from === 'blue') aiReactToBall(game.ball);
  }, C.DODGE_REACT);
}

function aiThrow() {
  const th = game.aiThrower, tg = game.aiTarget;
  if (!th || !th.alive || !tg || !tg.alive) { goto('PLAYER_ATTACK'); return; }

  const angle = Math.atan2(tg.y - th.y, tg.x - th.x)
                + (Math.random() - 0.5) * C.AI_SPREAD * 2;
  const spd   = C.AI_BASE_SPD + (Math.random() - 0.5) * C.AI_SPD_VAR;

  game.ball = new Ball(th.x, th.y, Math.cos(angle) * spd, Math.sin(angle) * spd, 'red');
  th.winding = false;
  game.phase = 'BALL_FLYING_A';
}

// ── Ball Physics & Hit Detection ──────────────────────────────────────────────
function updateBall(dt) {
  const b = game.ball;
  if (!b) return;

  b.age += dt;
  b.trail.push({ x: b.x, y: b.y });
  if (b.trail.length > 10) b.trail.shift();

  b.x += b.vx * dt / 1000;
  b.y += b.vy * dt / 1000;

  // Out of bounds → miss
  const mg = BR + 8;
  if (b.x < crtX - mg || b.x > crtX + crtW + mg ||
      b.y < crtY - mg || b.y > crtY + crtH + mg) {
    onMiss(); return;
  }

  // Hit detection
  const targets = b.from === 'blue' ? game.aiPlayers : game.players;
  for (const p of targets) {
    if (!p.alive) continue;
    if (Math.hypot(b.x - p.x, b.y - p.y) < (BR + p.r) * 1.2) {
      onHit(p); return;
    }
  }
}

function onHit(p) {
  p.alive = false;
  p.flash = C.FLASH_MS;
  game.effects.push({
    x: p.x, y: p.y, age: 0, dur: 650,
    maxR: PR * 3,
    color: p.team === 'blue' ? '#3a86ff' : '#ff4444',
  });
  game.ball        = null;
  game.resultMsg   = 'HIT!';
  game.resultColor = '#ff4444';
  game.resultTimer = C.RESULT_MS;
}

function onMiss() {
  game.ball        = null;
  game.resultMsg   = 'MISS!';
  game.resultColor = '#00ff88';
  game.resultTimer = C.RESULT_MS;
}

function checkWin() {
  const ra = game.aiPlayers.filter(p => p.alive).length;
  const pa = game.players.filter(p => p.alive).length;
  if (ra === 0) { game.winSide = 'blue'; goto('GAME_OVER'); return; }
  if (pa === 0) { game.winSide = 'red';  goto('GAME_OVER'); return; }
  // Alternate: player just threw → AI's turn; AI just threw → player's turn
  if (game.lastThrower === 'player') goto('AI_WINDUP');
  else goto('PLAYER_ATTACK');
}

// ── Update Loop ───────────────────────────────────────────────────────────────
let lastTs = 0;

function update(dt) {
  // Flash decay
  game.players.concat(game.aiPlayers).forEach(p => { if (p.flash > 0) p.flash -= dt; });

  // Effects
  game.effects = game.effects.filter(e => { e.age += dt; return e.age < e.dur; });

  // Result display pause
  if (game.resultTimer > 0) {
    game.resultTimer -= dt;
    if (game.resultTimer <= 0) checkWin();
    // AI still wanders during result pause for visual life
    if (game.phase !== 'MENU' && game.phase !== 'GAME_OVER') updateAI(dt);
    return;
  }

  const ph = game.phase;
  if (ph === 'MENU' || ph === 'GAME_OVER') return;

  updateBall(dt);
  updateAI(dt);

  if (ph === 'AI_WINDUP') {
    game.windupTimer -= dt;
    if (game.windupTimer <= 0) aiThrow();
  }
}

// ── Input ─────────────────────────────────────────────────────────────────────
const ptr = { dn: false };

function coords(e) {
  const r = canvas.getBoundingClientRect();
  const s = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
  return { x: s.clientX - r.left, y: s.clientY - r.top };
}

function nearPlayer(x, y, p) {
  return p.alive && Math.hypot(x - p.x, y - p.y) < p.r * 1.9;
}

function onDown(e) {
  e.preventDefault();
  const { x, y } = coords(e);
  ptr.dn = true;

  const ph = game.phase;

  if (ph === 'MENU' || ph === 'GAME_OVER') {
    if (inBtn(x, y)) initGame();
    return;
  }

  // Attack turn: start slingshot on any player touch
  if (ph === 'PLAYER_ATTACK') {
    for (const p of game.players) {
      if (nearPlayer(x, y, p)) {
        sl.on     = true;
        sl.player = p;
        sl.ox     = p.x;
        sl.oy     = p.y;
        sl.dx     = 0;
        sl.dy     = 0;
        break;
      }
    }
    return;
  }

  // Defense turns: drag player to reposition
  if (ph === 'AI_WINDUP' || ph === 'BALL_FLYING_A') {
    for (const p of game.players) {
      if (nearPlayer(x, y, p)) {
        mv.on     = true;
        mv.player = p;
        mv.offX   = p.x - x;
        mv.offY   = p.y - y;
        break;
      }
    }
  }
}

function onMove(e) {
  e.preventDefault();
  const { x, y } = coords(e);

  if (sl.on) {
    sl.dx = x - sl.ox;
    sl.dy = y - sl.oy;
  }

  if (mv.on && mv.player) {
    mv.player.x = x + mv.offX;
    mv.player.y = y + mv.offY;
    mv.player.clamp();
  }
}

function onUp(e) {
  e.preventDefault();
  if (!ptr.dn) return;
  ptr.dn = false;

  if (sl.on) playerThrow();

  mv.on     = false;
  mv.player = null;
}

let btnX = 0, btnY = 0, btnW = 220, btnH = 55;
function inBtn(x, y) { return x >= btnX && x <= btnX + btnW && y >= btnY && y <= btnY + btnH; }

canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove',  onMove, { passive: false });
canvas.addEventListener('touchend',   onUp,   { passive: false });
canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('mouseup',    onUp);

// ── Rendering ─────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, CW, CH);

  drawCourt();
  drawEffects();

  if (game.ball) { drawTrail(game.ball); drawBallShape(game.ball); }

  game.aiPlayers.concat(game.players).forEach(drawPlayer);

  // Slingshot overlay (on top of players)
  if (sl.on && sl.player) drawSlingshot();

  const ph = game.phase;
  if ((ph === 'AI_WINDUP' || ph === 'BALL_FLYING_A') && game.aiTarget && game.aiTarget.alive) {
    drawWarnRing(game.aiTarget);
  }
  if (ph === 'AI_WINDUP' && game.aiThrower && game.aiThrower.alive) {
    drawWindupRing();
  }

  drawHUD();
  if (game.resultMsg && game.resultTimer > 0) drawResult();
  if (ph === 'MENU')      drawMenu();
  if (ph === 'GAME_OVER') drawGameOver();
}

// ── Court ─────────────────────────────────────────────────────────────────────
function drawCourt() {
  ctx.fillStyle = '#1a4a24';
  rr(crtX, crtY, crtW, crtH, 12);
  ctx.fill();

  // Subtle horizontal texture lines
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const y = crtY + crtH * i / 6;
    ctx.beginPath();
    ctx.moveTo(crtX + 10, y);
    ctx.lineTo(crtX + crtW - 10, y);
    ctx.stroke();
  }

  // Center dashed line
  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(midX, crtY + 10);
  ctx.lineTo(midX, crtY + crtH - 10);
  ctx.stroke();
  ctx.restore();

  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 3;
  rr(crtX, crtY, crtW, crtH, 12);
  ctx.stroke();

  // Zone labels
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  ctx.font      = `bold ${Math.max(11, PR * 0.68)}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('YOUR SIDE',  crtX + crtW * 0.25, crtY + crtH * 0.5);
  ctx.fillText('THEIR SIDE', crtX + crtW * 0.75, crtY + crtH * 0.5);
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h,     x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y,         x + r, y);
  ctx.closePath();
}

// ── Player ────────────────────────────────────────────────────────────────────
function drawPlayer(p) {
  if (!p.alive) return;
  ctx.save();

  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur  = 8;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = p.flash > 0 ? '#ffffff' : (p.team === 'blue' ? '#3a86ff' : '#ff4444');
  ctx.fill();
  ctx.shadowBlur = 0;

  // Shine
  const g = ctx.createRadialGradient(
    p.x - p.r * 0.3, p.y - p.r * 0.35, p.r * 0.1,
    p.x, p.y, p.r
  );
  g.addColorStop(0, 'rgba(255,255,255,0.3)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  // Number
  ctx.fillStyle    = '#ffffff';
  ctx.font         = `bold ${Math.round(p.r * 0.78)}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.idx + 1, p.x, p.y + 1);

  ctx.restore();
}

// ── Slingshot ─────────────────────────────────────────────────────────────────
function drawSlingshot() {
  const p    = sl.player;
  const dist = Math.sqrt(sl.dx * sl.dx + sl.dy * sl.dy);
  const t    = Math.min(1, dist / C.SLING_MAX_PX);
  const cx   = sl.ox + sl.dx;
  const cy   = sl.oy + sl.dy;

  // Trajectory preview line
  if (dist >= C.SLING_MIN_PX) {
    const ndx = -sl.dx / dist;
    const ndy = -sl.dy / dist;
    ctx.save();
    ctx.setLineDash([6, 9]);
    ctx.strokeStyle = `rgba(255,255,80,${0.3 + t * 0.5})`;
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + ndx * crtW * 0.9, p.y + ndy * crtW * 0.9);
    ctx.stroke();
    ctx.restore();
  }

  // Rubber band lines from player edges to finger
  ctx.strokeStyle = `rgba(255,210,0,0.75)`;
  ctx.lineWidth   = 3;
  ctx.beginPath();
  ctx.moveTo(p.x - p.r * 0.45, p.y);
  ctx.lineTo(cx, cy);
  ctx.moveTo(p.x + p.r * 0.45, p.y);
  ctx.lineTo(cx, cy);
  ctx.stroke();

  // Ghost player at pull position
  ctx.save();
  ctx.globalAlpha = 0.38;
  ctx.beginPath();
  ctx.arc(cx, cy, p.r, 0, Math.PI * 2);
  ctx.fillStyle = '#3a86ff';
  ctx.fill();
  ctx.restore();

  // Power bar above player
  if (dist >= C.SLING_MIN_PX) {
    const bw = 58, bh = 8;
    const bx = p.x - bw / 2;
    const by = p.y - p.r - 22;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = t < 0.4 ? '#00ff88' : t < 0.72 ? '#ffcc00' : '#ff4444';
    ctx.fillRect(bx, by, bw * t, bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);
  }
}

// ── Warning & Windup ──────────────────────────────────────────────────────────
function drawWarnRing(p) {
  const pulse = (Math.sin(Date.now() / 80) + 1) / 2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r + 8 + pulse * 12, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255,60,60,${0.55 + pulse * 0.45})`;
  ctx.lineWidth   = 4;
  ctx.stroke();
  ctx.fillStyle    = `rgba(255,90,90,${0.82 + pulse * 0.18})`;
  ctx.font         = `bold ${Math.round(PR * 0.68)}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('MOVE!', p.x, p.y - p.r - 5);
}

function drawWindupRing() {
  const p    = game.aiThrower;
  const frac = 1 - game.windupTimer / C.WINDUP_MS;

  // Charging arc around thrower
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r + 13, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth   = 5;
  ctx.lineCap     = 'round';
  ctx.stroke();

  // Dashed aim line to target
  if (game.aiTarget && game.aiTarget.alive) {
    ctx.save();
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = 'rgba(255,100,100,0.32)';
    ctx.lineWidth   = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(game.aiTarget.x, game.aiTarget.y);
    ctx.stroke();
    ctx.restore();
  }
}

// ── Ball ──────────────────────────────────────────────────────────────────────
function drawTrail(b) {
  b.trail.forEach((pt, i) => {
    const a = (i / b.trail.length) * 0.38;
    const r = BR * (0.35 + 0.65 * (i / b.trail.length));
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220,220,255,${a})`;
    ctx.fill();
  });
}

function drawBallShape(b) {
  ctx.shadowColor = 'rgba(255,255,255,0.5)';
  ctx.shadowBlur  = 10;
  const g = ctx.createRadialGradient(
    b.x - BR * 0.3, b.y - BR * 0.35, 1,
    b.x, b.y, BR
  );
  g.addColorStop(0,   '#ffffff');
  g.addColorStop(0.6, '#dddddd');
  g.addColorStop(1,   '#aaaaaa');
  ctx.beginPath();
  ctx.arc(b.x, b.y, BR, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ── Effects ───────────────────────────────────────────────────────────────────
function drawEffects() {
  game.effects.forEach(fx => {
    const t = fx.age / fx.dur;
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, fx.maxR * t, 0, Math.PI * 2);
    ctx.strokeStyle  = fx.color;
    ctx.globalAlpha  = 1 - t;
    ctx.lineWidth    = 3;
    ctx.stroke();
    ctx.globalAlpha  = 1;
  });
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD() {
  const fsz = Math.max(14, Math.round(CH * 0.026));

  // Top score bar
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.fillRect(0, 0, CW, crtY - 2);

  const ab = game.players.filter(p => p.alive).length;
  const ar = game.aiPlayers.filter(p => p.alive).length;

  ctx.font         = `bold ${fsz}px Arial`;
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#3a86ff';
  ctx.textAlign = 'left';
  ctx.fillText(`YOU: ${ab}/3`, 14, crtY / 2);

  ctx.fillStyle = '#ff4444';
  ctx.textAlign = 'right';
  ctx.fillText(`THEM: ${ar}/3`, CW - 14, crtY / 2);

  const ph = game.phase;
  const phLabel = {
    PLAYER_ATTACK: 'YOUR TURN',
    BALL_FLYING_P: 'IN FLIGHT',
    AI_WINDUP:     '⚠ INCOMING!',
    BALL_FLYING_A: 'DODGE!',
  }[ph];

  if (phLabel) {
    ctx.fillStyle = (ph === 'AI_WINDUP' || ph === 'BALL_FLYING_A') ? '#ff8080' : '#ffffff';
    ctx.font      = `bold ${fsz}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(phLabel, CW / 2, crtY / 2);
  }

  // Bottom hint bar
  const barY = crtY + crtH + 4;
  const barH = CH - barY;
  if (barH > 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(0, barY, CW, barH);

    const hint = {
      PLAYER_ATTACK: 'Pull back a player to aim & throw',
      BALL_FLYING_P: '',
      AI_WINDUP:     'Drag your players to dodge!',
      BALL_FLYING_A: 'Drag to dodge!',
    }[ph];

    if (hint) {
      ctx.fillStyle    = 'rgba(255,255,255,0.65)';
      ctx.font         = `${Math.max(11, Math.round(CH * 0.021))}px Arial`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(hint, CW / 2, barY + barH / 2);
    }

    // Windup countdown bar
    if (ph === 'AI_WINDUP') {
      const frac = game.windupTimer / C.WINDUP_MS;
      const bw2  = Math.min(CW * 0.32, 170);
      const bh2  = Math.min(barH * 0.32, 9);
      const bx2  = CW / 2 - bw2 / 2;
      const by2  = barY + barH / 2 + 14;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(bx2, by2, bw2, bh2);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(bx2, by2, bw2 * frac, bh2);
    }
  }
}

function drawResult() {
  const a  = Math.min(1, game.resultTimer / (C.RESULT_MS * 0.45));
  const sz = Math.max(28, Math.round(CH * 0.06));
  ctx.save();
  ctx.globalAlpha  = a;
  ctx.font         = `bold ${sz}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle    = game.resultColor;
  ctx.shadowColor  = 'rgba(0,0,0,0.85)';
  ctx.shadowBlur   = 10;
  ctx.fillText(game.resultMsg, CW / 2, crtY + crtH / 2);
  ctx.restore();
}

// ── Overlays ──────────────────────────────────────────────────────────────────
function drawOverlay(title, titleColor, sub, btnLabel) {
  ctx.fillStyle = 'rgba(10,10,30,0.86)';
  ctx.fillRect(0, 0, CW, CH);

  const cx = CW / 2, cy = CH / 2;
  const tsz = Math.max(32, Math.round(CH * 0.075));
  ctx.fillStyle    = titleColor;
  ctx.font         = `bold ${tsz}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor  = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur   = 12;
  ctx.fillText(title, cx, cy - CH * 0.15);
  ctx.shadowBlur   = 0;

  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.font      = `${Math.max(13, Math.round(CH * 0.026))}px Arial`;
  ctx.fillText(sub, cx, cy - CH * 0.06);

  btnW = Math.min(220, CW * 0.5);
  btnH = Math.max(46, CH * 0.07);
  btnX = cx - btnW / 2;
  btnY = cy + CH * 0.02;

  ctx.fillStyle = '#3a86ff';
  rr(btnX, btnY, btnW, btnH, 10);
  ctx.fill();
  ctx.fillStyle    = '#ffffff';
  ctx.font         = `bold ${Math.max(16, Math.round(CH * 0.032))}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(btnLabel, cx, btnY + btnH / 2);
}

function drawMenu() {
  drawOverlay(
    'DODGEBALL', '#ffffff',
    'Pull back to throw  •  Drag to dodge',
    'START GAME'
  );
  ctx.fillStyle    = 'rgba(255,255,255,0.4)';
  ctx.font         = `${Math.max(11, Math.round(CH * 0.019))}px Arial`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(
    'Opponents move dynamically — aim carefully!',
    CW / 2, btnY + btnH + Math.max(20, CH * 0.042)
  );
}

function drawGameOver() {
  const won = game.winSide === 'blue';
  const ab  = game.players.filter(p => p.alive).length;
  const ar  = game.aiPlayers.filter(p => p.alive).length;
  drawOverlay(
    won ? 'YOU WIN!' : 'YOU LOSE!',
    won ? '#00ff88' : '#ff4444',
    `Blue: ${ab} alive  •  Red: ${ar} alive`,
    'PLAY AGAIN'
  );
}

// ── Game Loop ─────────────────────────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min(ts - lastTs, 50);
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
btnX = CW / 2 - 110;
btnY = CH / 2 + CH * 0.02;
requestAnimationFrame(ts => { lastTs = ts; loop(ts); });
</script>
</body>
